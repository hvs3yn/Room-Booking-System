spring:
  application:
    name: roombookingsystem
  config:
    # Loads DB_URL / DB_USERNAME / DB_PASSWORD from a local, git-ignored .env file
    import: optional:file:.env[.properties]
  datasource:
    # Neon example: jdbc:postgresql://ep-xxx-pooler.<region>.aws.neon.tech/neondb?sslmode=require
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Neon is serverless: keep the pool small and recycle connections before Neon drops them
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 300000
  sql:
    init:
      mode: always          # runs schema.sql on every start (CREATE TABLE IF NOT EXISTS)
  jpa:
    hibernate:
      ddl-auto: none        # tables come from schema.sql, not from Hibernate
    open-in-view: false
    show-sql: false

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  seed:
    enabled: true           # DataSeeder adds demo rooms on start
